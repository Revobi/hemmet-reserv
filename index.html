<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reserv">
<link rel="apple-touch-icon" href="ikon.png">
<title>Reservsändare</title>
<style>
:root{--bg:#f4f5f7;--kort:#fff;--txt:#16181d;--svag:#5d6470;--linje:#dde1e7;--acc:#1f6feb;--acc-txt:#fff;--ok:#1a7f37;--fel:#cf222e;--val:#e8f0fe}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--kort:#1a1d23;--txt:#e8eaee;--svag:#9aa3af;--linje:#2c313a;--acc:#4c8dff;--acc-txt:#fff;--ok:#3fb950;--fel:#f85149;--val:#1d2a40}}
:root[data-theme="dark"]{--bg:#0f1115;--kort:#1a1d23;--txt:#e8eaee;--svag:#9aa3af;--linje:#2c313a;--acc:#4c8dff;--acc-txt:#fff;--ok:#3fb950;--fel:#f85149;--val:#1d2a40}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:4px 0 2px}
.under{color:var(--svag);font-size:14px;margin:0 0 16px}
.kort{background:var(--kort);border:1px solid var(--linje);border-radius:14px;padding:14px;margin-bottom:14px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--svag);margin:0 0 10px}
.mallar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mall,.pers{border:1px solid var(--linje);background:var(--kort);color:var(--txt);border-radius:10px;padding:10px;font:inherit;font-size:14px;text-align:left;cursor:pointer;min-height:48px}
.mall.vald,.pers.vald{border-color:var(--acc);background:var(--val)}
label{display:block;font-size:13px;color:var(--svag);margin:10px 0 4px}
input,textarea,select{width:100%;font:inherit;font-size:16px;color:var(--txt);background:var(--bg);border:1px solid var(--linje);border-radius:10px;padding:10px}
textarea{min-height:110px;resize:vertical}
.rad{display:flex;gap:8px}.rad>div{flex:1}
.personer{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pers{text-align:center;font-weight:600}
.lank{background:none;border:0;color:var(--acc);font:inherit;font-size:14px;padding:6px 0;cursor:pointer}
.skicka{width:100%;background:var(--acc);color:var(--acc-txt);border:0;border-radius:12px;padding:15px;font:inherit;font-size:17px;font-weight:600;cursor:pointer}
.skicka:disabled{opacity:.55}
#resultat{margin-top:12px;font-size:15px}
#resultat div{padding:4px 0}
.ok{color:var(--ok)}.fel{color:var(--fel)}
.las{text-align:center;padding:40px 16px;color:var(--svag)}
.dold{display:none}
.not{font-size:13px;color:var(--svag);margin-top:10px}
</style>
</head>
<body>
<main>
<h1>📣 Reservsändare</h1>
<p class="under">Skickar driftinfo till familjen direkt från mobilen, även när nätet hemma är nere.</p>
<div id="las" class="las">Låser upp …</div>
<div id="app" class="dold">
  <div class="kort"><h2>1. Välj meddelande</h2><div id="mallar" class="mallar"></div></div>
  <div class="kort"><h2>2. Kontrollera texten</h2>
    <div id="platshallare" class="rad dold">
      <div><label for="nar">När</label><input id="nar" value="nu"></div>
      <div><label for="langd">Hur länge</label><input id="langd" value="en stund"></div>
    </div>
    <label for="rubrik">Rubrik</label><input id="rubrik" maxlength="120">
    <label for="text">Meddelande</label><textarea id="text" maxlength="2000"></textarea>
    <label for="prio">Viktighet</label>
    <select id="prio"><option value="3">Normal</option><option value="4">Hög</option><option value="5">Akut (ljud även i tyst läge)</option><option value="2">Låg</option></select>
  </div>
  <div class="kort"><h2>3. Till vem</h2><div id="personer" class="personer"></div>
    <button class="lank" id="alla" type="button">Välj alla</button></div>
  <button class="skicka" id="skicka" type="button">Skicka</button>
  <div id="resultat" aria-live="polite"></div>
  <p class="not">Skickat härifrån syns inte under "Senast skickat" i hemmaportalen.</p>
</div>
</main>
<script>
const DATA = "MeyWW2tqQes9KfwfWxTOlcQs_TyUbCafVcg2aMRMPT_hNvh98W6BcMP22SDEg8yQUr7JCmbAsw2KXgUE5nGb30XH8XBI9NR4kW1Ys9rbjTSfpRFk1QY7rxvwb0MlY08kvLqWOznyXdWrzJgIomAiyN17ZW17J7KXmVu3gN6zSUbThqjt4nSuJTrKEG0Qsx4PbQJV8x8BfQWi8RjKzif8sLKOG1OrUEqoPK4JhlTSSXx_-BHFfZbJvpd1FdBc07YmH181U-Jt6GVSL4JZRdWlDSoy02QBnp5C1WYcBYN1ck2MpeEy160SqMnLV-Jn70pShXgvpPhurARuC_jIgGHx2Mp-ER6Imw8apDT7As9x1-5p9xAuriWMFD3WvlY0wup49biX_JA9-wo7J2rc177-NK2EuxsTs8Nlj6qBadD9F9HZ0hzyOGf_yDCX833tFophH26LOASzaeikUdgTq99GE4BLyVAzWXbDjjOVHmhP2EaHORKxv5dh2fpamFXxEFUuN1VRBozqUDteUSWBz3Me-KIXEOAVAiyeN66F_zOAhmDXOE9CZ1Xcrxv1ou5qtwc894pR_DPQpTrfblHJtQN4CPGIMz8K946MXwIzwIGBd-2a4gEsRrvunplKPJ_C9-zkAGGaudQPGCScBN0DP3Gh_8BvriWszCE7D4lbTTRVZovtzvOJCVnvEIaAE6co1-6QSlZJbWXoLoaN2mNzEsreoibofSNJWxvEfl4rGaRAcx9-hbbdMuhDaDsbl9Yblq6xWBRGqJMNx3j6aA2ITYgM1ULW8v5pZyOsbIA6A5YA4k2afu53iIgVcQGZm7tUTWN-H71fNIpzZot7N3DWPaI6UeHeRr-NiPBBIAe6BfpVh7o9Zu2bEBW1EWdQhvvtNw7yaJgDteIvbynoam26tlPlmuHD4pETenZD2ofEPbzBu1mTJRKtgEERylwh-u2WVx3sYRbflbihpPnYeRSXjTfSvXVji_JblJ1E1ymcUZ6TgJ_PKArRcCBMpggicNufdsByUwioVs1D2__1RqJbH92CkOIKQVQQ1IR5hLOCa2rwOF-ZBG1daqGrTbbAOtMIdSDuHPpO1VLnrJobP60Goc08-kC-bvfhP_M1qTZxjjZxsNHNrkaFLaEkzRf0qRIxiSCd6MaIim9-60FFeuAUT3kZa9fKuhQodIfIsv08dd99fVj8RFboXmyoXKgdWFtdyZeps10h47Vt7WJE_uNzI7wrReSzWUQDrk_e7xMl-El5iuSCPDVz8XhsHlI1lJaTZi3628suUzXZb9YuaMQQnRxM4VEvTAnT3mWEox50kfy-E2C_7kqe6CeGbol-DL3EKHzWg9-ajv-LNQhAzeVfeXbnsR5wKDbKyKFGzdqeMDknL1zWe2hk5eKIFSmucoJpd5-Eauls8mkT1PBjZjLgta8jFiJC_w_W6uf8kuAFE5FW1erfQBy4iIk3wxNQiQONJV1GPRpcuQKRk_mezwUW1t1yySh-78QTGUSjn8Vog4lt4qh9iaGRrwxKY_d79o_vjuwYKRMX5rxqu2GNiBadLSZ_RCzwlzQoYArYzfosBZPt0NetC85IaadTIuDNbLhvHjRuFh65Qe-geY76WgzCGOjbXcR9X9TmuNGLOxfp-LHVqL2MVXeNhtizKmxmjGV0Tkn6orej-p5kEfn1P-A_H7Wf9Hpp0IRuhvIClP7t-gzdfh_XwSvaDsP_WmXERzQSBSNbjvxReFu_EeGCxL1t-MWRvAQXlhDw2NCUTYQSMktn2-s0vKG58wZmz61GOf_EF3HnCn-2A7ZMPaWvNTezNpPY1ls9xXfSdfD5Elh4uPlvOzSWPbiBMZS0DKbSyyVyX_j-1_YdIYN0XJz1VFkkst-KERtDMg";
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
let cfg = null, valdMall = null;
const valda = new Set();

function hamtaNyckel() {
  const m = location.hash.match(/k=([A-Za-z0-9_-]+)/);
  if (m) { try { localStorage.setItem('reservnyckel', m[1]); } catch (e) {} return m[1]; }
  try { return localStorage.getItem('reservnyckel'); } catch (e) { return null; }
}

async function lasUpp() {
  const k = hamtaNyckel();
  if (!k) { $('las').textContent = '🔒 Öppna sidan via din personliga länk (QR-koden).'; return; }
  try {
    const raw = b64(DATA), iv = raw.slice(0, 12), ct = raw.slice(12);
    const nyckel = await crypto.subtle.importKey('raw', b64(k), 'AES-GCM', false, ['decrypt']);
    cfg = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, nyckel, ct)));
  } catch (e) { $('las').textContent = '🔒 Länken stämmer inte. Använd den senaste QR-koden.'; return; }
  $('las').classList.add('dold'); $('app').classList.remove('dold');
  rita();
}

function rita() {
  $('mallar').replaceChildren(...cfg.mallar.map((m, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'mall'; b.textContent = m.ikon + ' ' + m.titel;
    b.onclick = () => valjMall(i); return b;
  }));
  $('personer').replaceChildren(...cfg.personer.map(p => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'pers'; b.textContent = p.namn; b.dataset.id = p.id;
    b.onclick = () => { valda.has(p.id) ? valda.delete(p.id) : valda.add(p.id); markera(); }; return b;
  }));
  markera();
}

function markera() {
  document.querySelectorAll('.pers').forEach(b => b.classList.toggle('vald', valda.has(b.dataset.id)));
  document.querySelectorAll('.mall').forEach((b, i) => b.classList.toggle('vald', i === valdMall));
}

function fyll() {
  const m = cfg.mallar[valdMall]; if (!m) return;
  $('text').value = m.text.replace(/\{när\}/g, $('nar').value.trim()).replace(/\{längd\}/g, $('langd').value.trim());
}

function valjMall(i) {
  const m = cfg.mallar[i]; valdMall = i;
  $('rubrik').value = m.ikon + ' ' + m.titel; $('prio').value = String(m.prio);
  $('platshallare').classList.toggle('dold', !/\{(när|längd)\}/.test(m.text));
  fyll(); markera();
}

async function skickaEn(p, rubrik, text, prio) {
  const q = new URLSearchParams({ title: rubrik, priority: prio, tags: 'house' });
  for (let forsok = 1; forsok <= 3; forsok++) {
    const ac = new AbortController(), t = setTimeout(() => ac.abort(), 15000);
    try {
      const r = await fetch('https://ntfy.sh/' + p.topic + '?' + q, { method: 'POST', body: text, signal: ac.signal });
      if (r.ok && (await r.json()).id) return true;
    } catch (e) {} finally { clearTimeout(t); }
    await new Promise(ok => setTimeout(ok, 1500 * forsok));
  }
  return false;
}

async function skicka() {
  const rubrik = $('rubrik').value.trim() || 'Hemmet', text = $('text').value.trim(), prio = $('prio').value;
  const till = cfg.personer.filter(p => valda.has(p.id));
  const res = $('resultat');
  if (!text || !till.length) { res.innerHTML = '<div class="fel">Skriv ett meddelande och välj minst en person.</div>'; return; }
  $('skicka').disabled = true; res.replaceChildren();
  for (const p of till) {
    const rad = document.createElement('div'); rad.textContent = '⏳ ' + p.namn + ' …'; res.append(rad);
    const ok = await skickaEn(p, rubrik, text, prio);
    rad.className = ok ? 'ok' : 'fel';
    rad.textContent = (ok ? '✓ ' : '✗ ') + p.namn + (ok ? ' – skickat' : ' – gick inte fram, försök igen');
  }
  $('skicka').disabled = false;
}

$('nar').oninput = fyll; $('langd').oninput = fyll;
$('alla').onclick = () => { cfg.personer.forEach(p => valda.add(p.id)); markera(); };
$('skicka').onclick = skicka;
lasUpp();
</script>
</body>
</html>
